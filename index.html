(function () {
  var today = new Date();
  today.setHours(0, 0, 0, 0);

  function parseDate(str) {
    return new Date((str.length === 7 ? str + "-01" : str) + "T00:00:00");
  }

  function formatDate(str) {
    if (!str) return "TBD";
    var opts = { month: "long", year: "numeric" };
    if (str.length > 7) opts.day = "numeric";
    return parseDate(str).toLocaleDateString("en-US", opts);
  }

  function isPast(race) {
    if (!race.date || race.date.length <= 7) return false;
    return parseDate(race.date) < today;
  }

  var upcoming = races.filter(function (r) { return !isPast(r); });
  var past = races.filter(isPast);

  // Upcoming: soonest first. Undated races sort to the end.
  upcoming.sort(function (a, b) {
    if (!a.date) return 1;
    if (!b.date) return -1;
    return parseDate(a.date) - parseDate(b.date);
  });

  // Archive: most recent first.
  past.sort(function (a, b) { return parseDate(b.date) - parseDate(a.date); });

  function render(list, race, showTime) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = race.resultsUrl || race.signupUrl;
    var label = race.name + " - " + race.distance + " - " + formatDate(race.date);
    if (showTime && race.time) {
      label += " - (" + race.time + ")";
    }
    a.textContent = label;
    li.appendChild(a);
    list.appendChild(li);
  }

  var upcomingList = document.getElementById("upcoming-list");
  var archiveList = document.getElementById("archive-list");
  upcoming.forEach(function (r) { render(upcomingList, r, false); });
  past.forEach(function (r) { render(archiveList, r, true); });
})();
